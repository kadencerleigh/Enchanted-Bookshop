<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16221c">
<title>Enchanted Bookshop</title>
<link rel="manifest" href="manifest.json?v=4.17">
<link rel="icon" href="icon-192.png?v=4.17">
<link rel="apple-touch-icon" href="icon-192.png?v=4.17">
<link rel="stylesheet" href="styles.css?v=4.17">
</head>
<body>
<div class="shell">
<aside class="side">
 <div class="brand"><div class="moon">☾</div><div><h1>Enchanted<br>Bookshop</h1><small>V4.17 • Reading Statistics & Insights</small></div></div>
 <div class="nav" id="nav">
  <button class="active" data-view="home">🏠 <span>Bookshop</span></button>
  <button data-view="library">📚 <span>My Library</span></button>
  <button data-view="browse">🌙 <span>Browse</span></button>
  <button data-view="series">🔮 <span>Series</span></button>
  <button data-view="wishlist">✨ <span>Want to Own</span></button>
  <button data-view="journal">🕯️ <span>Reading Journal</span></button>
  <button data-view="insights">📊 <span>Insights</span></button>
  <button data-view="tbr">📖 <span>TBR</span></button>
  <button data-view="favorites">⭐ <span>Favorites</span></button>
  <button data-view="backup">💾 <span>Backup</span></button>
  <button data-view="sync">☁️ <span>Sync</span></button>
 </div>
 <button class="scanbtn" id="scanBtn">📷 <span>Shopping Scanner</span></button>
 <div class="sidefoot">local-first • offline-ready<br>sync is optional</div>
</aside>
<nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
 <button data-view="home">🏠<span>Home</span></button>
 <button data-view="library">📚<span>Library</span></button>
 <button data-view="browse">🌙<span>Browse</span></button>
 <button id="mobileScanBtn" class="mobile-scan">📷<span>Scanner</span></button>
 <button id="mobileMoreBtn">•••<span>More</span></button>
</nav>
<div class="mobile-more hidden" id="mobileMore">
 <button class="mobile-more-shade" id="mobileMoreShade" aria-label="Close"></button>
 <div class="mobile-more-card">
  <div class="mobile-more-top"><b>More from your Bookshop</b><button id="mobileMoreClose">×</button></div>
  <div class="mobile-build-version">Enchanted Bookshop · V4.17</div>
  <div class="mobile-more-grid">
   <button data-view="series">🔮 <span>Series</span></button>
   <button data-view="wishlist">✨ <span>Want to Own</span></button>
   <button data-view="journal">🕯️ <span>Reading Journal</span></button>
   <button data-view="insights">📊 <span>Insights</span></button>
   <button data-view="tbr">📖 <span>TBR</span></button>
   <button data-view="favorites">⭐ <span>Favorites</span></button>
   <button data-view="backup">💾 <span>Backup</span></button>
   <button data-view="sync">☁️ <span>Sync</span></button>
  </div>
 </div>
</div>

<main class="main">
 <div class="top">
  <input id="search" class="search" placeholder="Search your bookshop...">
  <button id="installBtn" class="hidden">⬇ Install</button>
  <button class="add" id="addBtn">＋ Add Book</button>
 </div>
 <section id="content"></section>
</main>
</div>
<div class="modal hidden" id="modal"><div class="modalcard"><button class="close" id="closeModal">×</button><div id="modalBody"></div></div></div>
<script src="app.js?v=4.17"></script>
</body>
</html>
