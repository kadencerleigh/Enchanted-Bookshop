
name: Enchanted Bookshop Cloud Guardian

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-supabase-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read Supabase heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing Supabase repository secrets"
            exit 1
          fi

          curl --fail --show-error --silent \
            --retry 2 \
            --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/heartbeat?select=*" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            > /dev/null

          echo "Supabase heartbeat read successfully"
